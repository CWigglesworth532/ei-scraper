      levels: ["1", "2", "3"]
    field_map:
      indicator_id: measure_id
      geography_scheme: geography_type
      geography_version: geography_vintage
      geography_level: itl_level
      geography_code: itl_code
      period: period
      period_type: period_type
      value: value
      unit: unit
      value_status: status
