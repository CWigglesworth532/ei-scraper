schema_version: sko-036-direct-economic-source-v1
coefficient_schema_version: sko-036-direct-economic-coefficient-v1
coefficient_release_version: v1-draft
model_classification: NACE
model_classification_version: "Rev. 2 A*64"

denominator_routes:
  default:
    source_family: national_accounts
    denominator_concept_code: P1
    method: output_basic_prices
    compatibility_class: OUTPUT_PROXY_ACCEPTED
    required_denominator_unit: million_currency
  trade_turnover:
    model_sector_codes: [G45, G46, G47]
    source_family: business_statistics
    denominator_concept_code: TURNOVER
    method: turnover_revenue_basis
    compatibility_class: TURNOVER_ROUTE_REQUIRED
    required_denominator_unit: million_currency

outcomes:
  GVA:
    label: Gross value added
    numerator_concept_code: B1G
    coefficient_unit: currency_gva_per_currency_denominator
    scale: "1"
    required_numerator_unit: million_currency
    applicable_routes: [default, trade_turnover]
  INTERMEDIATE_CONSUMPTION:
    label: Intermediate consumption
    numerator_concept_code: P2
    coefficient_unit: currency_intermediate_consumption_per_currency_denominator
    scale: "1"
    required_numerator_unit: million_currency
    applicable_routes: [default]
  EMPLOYEE_COMPENSATION:
    label: Compensation of employees
    numerator_concept_code: D1
    coefficient_unit: currency_employee_compensation_per_currency_denominator
    scale: "1"
    required_numerator_unit: million_currency
    applicable_routes: [default]
  LABOUR_COSTS:
    label: Employee benefits / employment costs
    numerator_concept_code: LABOUR_COSTS
    coefficient_unit: currency_labour_costs_per_currency_denominator
    scale: "1"
    required_numerator_unit: million_currency
    applicable_routes: [trade_turnover]
  PRODUCTION_TAXES_NET:
    label: Other taxes less subsidies on production
    numerator_concept_code: D29X39
    coefficient_unit: currency_production_taxes_net_per_currency_denominator
    scale: "1"
    required_numerator_unit: million_currency
    applicable_routes: [default]
  OPERATING_SURPLUS_MIXED_INCOME:
    label: Gross operating surplus and mixed income
    numerator_concept_code: B2A3G
    coefficient_unit: currency_operating_surplus_mixed_income_per_currency_denominator
    scale: "1"
    required_numerator_unit: million_currency
    applicable_routes: [default]
    derivation:
      operation: sum
      source_concept_codes: [B2A3N, P51C]
      label: Gross operating surplus and mixed income derived as B2A3N + P51C
  CONSUMPTION_FIXED_CAPITAL:
    label: Consumption of fixed capital
    numerator_concept_code: P51C
    coefficient_unit: currency_consumption_fixed_capital_per_currency_denominator
    scale: "1"
    required_numerator_unit: million_currency
    applicable_routes: [default]
  EMPLOYMENT_PERSONS:
    label: Persons employed
    numerator_concept_code: EMP_PERSONS
    coefficient_unit: persons_per_million_currency_denominator
    scale: "1"
    required_numerator_unit: persons
    applicable_routes: [default, trade_turnover]
    numerator_source_family_order:
      default: [national_accounts, business_statistics]
      trade_turnover: [business_statistics]
  EMPLOYMENT_HOURS:
    label: Hours worked
    numerator_concept_code: EMP_HOURS
    coefficient_unit: hours_per_million_currency_denominator
    scale: "1"
    required_numerator_unit: hours
    applicable_routes: [default]
  GROSS_FIXED_CAPITAL_FORMATION:
    label: Gross fixed capital formation
    numerator_concept_code: P51G
    coefficient_unit: currency_gfcf_per_currency_denominator
    scale: "1"
    required_numerator_unit: million_currency
    applicable_routes: [default]

accounting_identity:
  source_family: national_accounts
  left_concept_code: P1
  right_concept_code_a: P2
  right_concept_code_b: B1G
  absolute_tolerance: "0.1"
  tolerance_basis: published_million_euro_rounding

reference_year_policy:
  mode: fixed_release_year
  primary_reference_year: 2023
  automatic_year_fallback_enabled: false
  status: owner_approved_2026-09-09
  rule: use_2023_exact_year_coefficients_only_for_v1
  spend_year_matching_required: false
  provenance_requirement: record_spend_year_and_coefficient_reference_year_separately
  missing_2023_rule: hold_out_for_review
  rationale: 2023 provides the most complete stable common-year coverage across Eurostat country x sector x outcome diagnostics while avoiding mixed-year coefficient releases

currency_normalisation:
  spend_currency: EUR
  mode: fixed_reference_year_annual_average
  reference_year: 2023
  status: owner_approved_2026-09-09
  monetary_ratio_rule: no_fx_dimensionless_ratio
  absolute_unit_rule: convert_spend_to_denominator_currency_before_applying_coefficient
  missing_rate_rule: hold_out_for_review
  rate_quote_convention: denominator_currency_per_EUR
  rates:
    EUR:
      rate: "1"
      source_organisation: European Central Bank
      source_series_key: euro_base_identity
      source_url: ""
    GBP:
      rate: "0.86979"
      source_organisation: European Central Bank
      source_series_key: EXR.A.GBP.EUR.SP00.A
      source_url: https://data.ecb.europa.eu/data/datasets/EXR/EXR.A.GBP.EUR.SP00.A
      source_note: 2023 annual average pound sterling per euro

source_catalogue:
  eurostat_national_accounts:
    organisation: Eurostat
    dataset_id: nama_10_a64
    intended_concepts: [P1, P2, B1G, D1, D29X39, B2A3N, P51C]
    derived_concepts:
      B2A3G:
        formula: B2A3N + P51C
        provenance_rule: retain_both_component_source_records
    classification: NACE Rev. 2 A*64
    retrieval_route: Eurostat dissemination API / bulk download
    licence: Eurostat reuse policy with source acknowledgement
  eurostat_employment:
    organisation: Eurostat
    dataset_id: nama_10_a64_e
    intended_concepts: [EMP_PERSONS, EMP_HOURS]
    classification: NACE Rev. 2 A*64
    retrieval_route: Eurostat dissemination API / bulk download
    licence: Eurostat reuse policy with source acknowledgement
    raw_dimensions:
      concept: na_item
      unit: unit
    normalization_map:
      "EMP_DC|THS_PER":
        concept_code: EMP_PERSONS
        normalized_unit: persons
        scale: "1000"
      "EMP_DC|THS_HW":
        concept_code: EMP_HOURS
        normalized_unit: hours
        scale: "1000"
    mapping_rule: na_item_and_unit_required
  eurostat_capital:
    organisation: Eurostat
    dataset_id: nama_10_a64_p5
    intended_concepts: [P51G]
    classification: NACE Rev. 2 A*64
    retrieval_route: Eurostat dissemination API / bulk download
    licence: Eurostat reuse policy with source acknowledgement
  eurostat_sbs:
    organisation: Eurostat
    dataset_id: sbs_ovw_act
    intended_concepts: [TURNOVER, B1G, LABOUR_COSTS, EMP_PERSONS]
    source_measure_mapping:
      NETTUR_MEUR: TURNOVER
      AV_MEUR: B1G
      EXPN_SAL_BEN_MEUR: LABOUR_COSTS
      EMP_NR: EMP_PERSONS
    classification: NACE Rev. 2
    retrieval_route: Eurostat dissemination API / bulk download
    licence: Eurostat reuse policy with source acknowledgement
    semantic_note: LABOUR_COSTS is not ESA D1 compensation of employees
  ons_supply_use:
    organisation: Office for National Statistics
    dataset_id: input-output-supply-and-use-tables
    intended_concepts: [P1, P2, B1G, D1, D29X39, B2A3G, P51C]
    classification: UK SIC 2007 mapped transparently to NACE Rev. 2-compatible model sectors
    retrieval_route: ONS published xlsx release
    licence: Open Government Licence
  ons_abs:
    organisation: Office for National Statistics
    dataset_id: annual-business-survey
    intended_concepts: [TURNOVER, B1G, LABOUR_COSTS, EMP_PERSONS]
    classification: UK SIC 2007 mapped transparently to NACE Rev. 2-compatible model sectors
    retrieval_route: ONS published xlsx/csv release
    licence: Open Government Licence
    semantic_note: ABS approximate GVA and employment costs must retain business-statistics semantics and must not be relabelled as ESA B1G or D1 without an explicit compatibility decision
  ons_bres:
    organisation: Office for National Statistics
    dataset_id: business-register-and-employment-survey
    intended_concepts: [EMP_PERSONS]
    classification: UK SIC 2007 mapped transparently to NACE Rev. 2-compatible model sectors
    retrieval_route: ONS published xlsx release
    licence: Open Government Licence
  ons_gfcf:
    organisation: Office for National Statistics
    dataset_id: annual-gross-fixed-capital-formation-by-industry-and-asset
    intended_concepts: [P51G]
    classification: UK SIC 2007 mapped transparently to NACE Rev. 2-compatible model sectors
    retrieval_route: ONS published xlsx/csv release
    licence: Open Government Licence
  ons_capital_stocks:
    organisation: Office for National Statistics
    dataset_id: capital-stocks-and-fixed-capital-consumption
    intended_concepts: [P51C]
    classification: UK SIC 2007 / published ONS industry aggregation; exact model-sector coverage must be verified before use
    retrieval_route: ONS published xlsx release
    licence: Open Government Licence
  ons_ashe_hours:
    organisation: Office for National Statistics
    dataset_id: annual-survey-of-hours-and-earnings-industry-tables
    intended_concepts: []
    classification: UK SIC 2007
    retrieval_route: ONS published xlsx release
    licence: Open Government Licence
    governance_status: deferred_not_comparable_v1
    semantic_note: paid employee hours are not automatically comparable with Eurostat national-accounts total hours worked
  ecb_exchange_rates:
    organisation: European Central Bank
    dataset_id: EXR
    intended_concepts: [annual_average_reference_exchange_rate]
    retrieval_route: ECB Data Portal
    licence: ECB reuse terms
    governance_note: use fixed coefficient reference year annual average rates quoted as denominator currency per EUR for absolute-unit outcomes only
